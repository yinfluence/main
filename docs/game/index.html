<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>伊朗维稳 · 颖响力地缘推演</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="./css/game.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <!-- 顶部：稳定总进度 -->
  <div id="hud-top">
    <div id="stable-count">0 / 31 省稳定</div>
    <div class="bar-track"><div id="stable-bar" class="bar-fill green"></div></div>
  </div>

  <!-- 右上：资源条 -->
  <div id="hud-resources">
    <div class="res"><span class="res-label">石油预算</span><span id="r-money" class="res-val">$35</span></div>
    <div class="res legit">
      <span class="res-label">合法性</span><span id="r-legit" class="res-val">100</span>
      <div class="bar-track sm"><div id="r-legit-bar" class="bar-fill gold"></div></div>
    </div>
    <div class="res"><span class="res-label">通胀</span><span id="r-inflation" class="res-val">0</span></div>
    <div class="res"><span class="res-label">腐败</span><span id="r-corruption" class="res-val">2%</span></div>
    <div class="res"><span id="r-month" class="res-val">第 0 月</span></div>
  </div>

  <!-- 时间控制 -->
  <div id="time-controls">
    <button id="btn-pause">▶ 继续</button>
    <button id="spd-1" class="spd active">1×</button>
    <button id="spd-2" class="spd">2×</button>
    <button id="spd-3" class="spd">3×</button>
  </div>

  <!-- 省详情面板 -->
  <div id="zone-panel" class="empty">
    <div class="zp-hint">点击地图上的省份，选中后再施政</div>
  </div>

  <!-- 事件日志 -->
  <div id="log-panel"><div id="log-list"></div></div>

  <!-- 左下 Operation 按钮 + 项目面板 -->
  <button id="op-button">⚙ 施政</button>
  <div id="op-panel">
    <div class="op-tabs">
      <button id="tab-civilian" class="op-tab active">民生治理</button>
      <button id="tab-military" class="op-tab">安全军事</button>
    </div>
    <div class="op-hint">选中一个省后点卡片投放</div>
    <div id="cards-civilian" class="op-cards"></div>
    <div id="cards-military" class="op-cards hidden"></div>
  </div>

  <!-- 开始 / 胜负屏 -->
  <div id="overlay">
    <div class="overlay-box">
      <h1 id="overlay-title">伊朗维稳</h1>
      <p id="overlay-body">
        哈梅内伊身后，接班真空。东南俾路支、西北库尔德的分离武装正在坐大。<br>
        你是新的治理者——在叛乱吞掉全国前，把 31 个省一个个稳下来。<br>
        合法性归零，你就下台。
      </p>
      <button id="overlay-start">开始维稳</button>
      <button id="overlay-restart" class="hidden">再来一局</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
